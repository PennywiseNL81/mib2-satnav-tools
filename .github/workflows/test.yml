name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: |
          python -m py_compile \
            mib2nds-tool/mapui.py mib2nds-tool/mapdata.py \
            mib2nds-tool/osutil.py mib2nds-tool/query.py \
            mib2nds-tool/updates.py mib2nds-tool/nds2sqlite.py \
            mib2nds-tool/ndsgeo.py mib2nds-tool/stop_mapui.py \
            sd-updater/update_sd.py install.py

      - name: Smoke test - no MIB2 SD card present
        run: |
          out=$(python sd-updater/update_sd.py detect || true)
          echo "$out"
          grep -q "no MIB2 SD card found" <<< "$out"

      - name: Smoke test - compatibility check on the fixture
        run: |
          python mib2nds-tool/query.py --map tests/fixtures/mini_map compat

      - name: Smoke test - SD updater dry-run on the fixture
        env:
          MIB2_CONFIG: "${{ runner.temp }}/ci_config.json"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/BACKUP"
          printf '{"dirs":{"work":"%s/_work","downloads":"%s/downloads","backup":"%s/BACKUP"}}\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" \
            > "$MIB2_CONFIG"
          python sd-updater/update_sd.py install \
            --source tests/fixtures/mini_map \
            --sd tests/fixtures/mini_map \
            --dry-run --yes

      - name: Smoke test - car-profile auto-setup (workaround path)
        env:
          MIB2_CONFIG: "${{ runner.temp }}/ci_profile_config.json"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/BACKUP"
          printf '{"dirs":{"work":"%s/_work","downloads":"%s/downloads","backup":"%s/BACKUP"}}\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" \
            > "$MIB2_CONFIG"
          out=$(python sd-updater/update_sd.py profile \
            --from tests/fixtures/mini_card_0635 --yes)
          echo "$out"
          grep -q "6P0919866H" <<< "$out"
          grep -q "workaround: enabled" <<< "$out"
          grep -q "0635 (ECE1 2016/17)" <<< "$out"
          test -f "$GITHUB_WORKSPACE/BACKUP/original/maps/EEC/EEC_WLD/OVERALL.NDS"
          python -c "import json, os; cfg=json.load(open(os.environ['MIB2_CONFIG'])); assert cfg['car']['part_number']=='6P0919866H'; assert cfg['car']['workaround']['enabled'] is True; assert cfg['car']['original_release']=='0635 (ECE1 2016/17)'; assert cfg['car']['region_prefix']=='ECE'; print('profile config ok')"

      - name: Smoke test - web UI start + shutdown
        run: |
          python mib2nds-tool/mapui.py --no-browser &
          pid=$!
          sleep 4
          curl -fsS http://127.0.0.1:5000/api/maps >/dev/null
          curl -fsS -X POST http://127.0.0.1:5000/api/shutdown \
            -H 'Content-Type: application/json' -d '{}' >/dev/null
          wait $pid || true
